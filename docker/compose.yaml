# ROS 2 Humble development container for the hexapod.
#
#   docker compose -f docker/compose.yaml up -d --build
#   docker exec -it hexabot_ros bash
#
# Isaac Sim runs natively on Windows (see docker/ISAAC_WINDOWS.md), not in
# Docker: its RTX renderer does not work inside WSL2 containers. This container
# uses host networking so ROS 2 DDS discovery reaches Isaac Sim on Windows.
# That needs WSL "mirrored" networking (see ISAAC_WINDOWS.md).

services:
  ros-humble:
    build:
      context: .
      dockerfile: Dockerfile
    image: hexabot-ros:humble
    container_name: hexabot_ros
    working_dir: /home/ros/ros_ws
    volumes:
      - ../ros_ws:/home/ros/ros_ws
      # GPU (WSL2): Windows GPU driver libs, used by Mesa's d3d12 driver
      - /usr/lib/wsl:/usr/lib/wsl:ro
      # Display: WSLg's built-in X server (no VcXsrv needed)
      - /run/desktop/mnt/host/wslg/.X11-unix:/tmp/.X11-unix
      - /run/desktop/mnt/host/wslg:/mnt/wslg
    devices:
      # GPU (WSL2): paravirtualized GPU device
      - /dev/dxg:/dev/dxg
    environment:
      # Must match ROS_DOMAIN_ID and RMW in Isaac Sim on Windows
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      DISPLAY: ":0"
      WAYLAND_DISPLAY: wayland-0
      XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
      # Render OpenGL on the NVIDIA GPU through WSL instead of on the CPU
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      GALLIUM_DRIVER: d3d12
      MESA_D3D12_DEFAULT_ADAPTER_NAME: NVIDIA
    network_mode: host
    stdin_open: true
    tty: true
    command: /bin/bash
